<section>
  <h2>Пересмотр критерия</h2>
  <p>Исходная оценка: <strong data-original></strong> · После решения: <strong data-final></strong></p>
  <form data-request>
    <label>Почему вы оспариваете оценку? <textarea name="comment" required maxlength="4000"></textarea></label>
    <button>Подать апелляцию</button>
  </form>
  <div data-history hidden>
    <h3>Обращение</h3>
    <p data-status></p>
    <blockquote data-comment></blockquote>
    <p data-reason></p>
  </div>
  <form data-review hidden>
    <h3>Решение проверяющего</h3>
    <label>Действие
      <select name="action">
        <option value="confirm">Подтвердить исходную оценку</option>
        <option value="change">Изменить оценку</option>
      </select>
    </label>
    <label data-score-field hidden>Новый балл <select name="score"></select></label>
    <label>Причина решения <textarea name="reason" required maxlength="4000"></textarea></label>
    <button>Сохранить решение</button>
  </form>
  <p role="status" aria-live="polite"></p>
</section>
